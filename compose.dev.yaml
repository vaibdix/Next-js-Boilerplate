services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: nextjs-latest-starter:dev
    container_name: nextjs-latest-dev
    ports:
      - '3000:3000' # next dev
      - '8969:8969' # sentry spotlight
    env_file:
      - .env.local
    volumes:
      - ./:/app:cached
      - dev-node-modules:/app/node_modules
      - dev-next-cache:/app/.next
      - dev-pnpm-store:/pnpm
    tty: true
    stdin_open: true

volumes:
  dev-node-modules:
  dev-next-cache:
  dev-pnpm-store:
