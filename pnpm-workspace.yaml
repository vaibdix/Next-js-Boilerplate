packages:
  - .

# Supply chain hardening
minimumReleaseAge: 2880 # 2 days in minutes
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
saveExact: true
blockExoticSubdeps: true
strictPeerDependencies: true
verifyDepsBeforeRun: error
trustPolicy: no-downgrade
trustPolicyExclude:
  - 'semver@6.3.1'

# Checkly 8.19.0 still carries TypeScript-ESLint 8 peers capped below TypeScript 7.
peerDependencyRules:
  allowedVersions:
    '@typescript-eslint/project-service@8.65.0>typescript': '7.0.2'
    '@typescript-eslint/tsconfig-utils@8.65.0>typescript': '7.0.2'
    '@typescript-eslint/typescript-estree@8.65.0>typescript': '7.0.2'

# Postinstall script allowlist
allowBuilds:
  '@clerk/shared': true
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  lefthook: true
  msw: true
  sharp: true

# Spotlight 4.11.8 calls ctx.req.query().toString(); hono 4.12.32+ returns
# null-prototype query objects. Exact pin: latest hono that supports Spotlight.
overrides:
  hono: '4.12.31'
