# Validate commit messages
commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

# Validate content before committing
pre-commit:
  jobs:
    - name: oxlint
      run: pnpm exec oxlint --fix {staged_files}
      glob:
        - '**/*.js'
        - '**/*.jsx'
        - '**/*.ts'
        - '**/*.tsx'
      stage_fixed: true

    - name: oxfmt
      run: pnpm exec oxfmt --write {staged_files}
      glob:
        - '**/*.js'
        - '**/*.jsx'
        - '**/*.ts'
        - '**/*.tsx'
        - '**/*.json'
        - '**/*.jsonc'
        - '**/*.css'
      stage_fixed: true

    - name: stylelint
      run: pnpm exec stylelint --fix {staged_files}
      glob: '**/*.css'
      stage_fixed: true

    - name: optimize-images
      run: node scripts/optimize-images.ts {staged_files}
      glob:
        - '**/*.jpg'
        - '**/*.jpeg'
        - '**/*.png'
        - '**/*.webp'
        - '**/*.tiff'
        - '**/*.tif'
        - '**/*.heic'
        - '**/*.heif'
        - '**/*.gif'
      stage_fixed: true

    - name: knip
      run: pnpm run check:deps
      glob: '*'

    - name: secretlint
      run: pnpm exec secretlint --maskSecrets {staged_files}
      glob: '*'

pre-push:
  parallel: false
  jobs:
    - name: types
      run: pnpm run check:types

    - name: unit-tests
      run: pnpm run test

    - name: pnpm-audit
      run: pnpm audit --prod --audit-level=high
