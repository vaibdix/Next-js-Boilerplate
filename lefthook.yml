# Validate commit messages
commit-msg:
  jobs:
    - name: commitlint
      run: npx --no -- commitlint --edit {1}

# Validate content before committing
pre-commit:
  jobs:
    - name: ultracite
      run: npx ultracite fix --type-aware --type-check
      glob:
        - '**/*.js'
        - '**/*.jsx'
        - '**/*.ts'
        - '**/*.tsx'
        - '**/*.json'
        - '**/*.jsonc'
        - '**/*.css'
      stage_fixed: true

    - name: stylelint
      run: pnpm exec stylelint --fix {staged_files}
      glob: '**/*.css'
      stage_fixed: true

    - name: optimize-images
      run: pnpm exec tsx scripts/optimize-images.ts {staged_files}
      glob:
        - '**/*.jpg'
        - '**/*.jpeg'
        - '**/*.png'
        - '**/*.webp'
        - '**/*.tiff'
        - '**/*.tif'
        - '**/*.heic'
        - '**/*.heif'
        - '**/*.gif'
      stage_fixed: true

    - name: knip
      run: npm run check:deps
      glob: '*'

    # Secrets scanning (OWASP devguide: pre-commit secrets hook).
    # Blocks accidentally staged Clerk/Sentry/Arcjet/FormSubmit keys before
    # they enter git history. Config: .secretlintrc.json.
    - name: secretlint
      run: pnpm exec secretlint --maskSecrets {staged_files}
      glob: '*'

# Validate before pushing to the remote
pre-push:
  jobs:
    # Dependency vulnerability check (OWASP A06).
    # Production deps only, blocks on high/critical severity.
    - name: pnpm-audit
      run: pnpm audit --prod --audit-level=high
